databaseChangeLog:
  - changeSet:
      id: 'users-base-schema'
      author: 'jorgonor'
      context: 'users-domain'
      changes:
        - createTable:
            tableName: USR_USER
            columns:
              - column:
                  name: USER_ID
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: EMAIL
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: NICKNAME
                  type: VARCHAR(63)
                  constraints:
                    nullable: false
              - column:
                  name: PASSWORD
                  type: VARCHAR(255)
              - column:
                  name: AUTH_TYPE
                  type: VARCHAR(31)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: LAST_ACCESS
                  type: TIMESTAMP
        - addPrimaryKey:
            tableName: USR_USER
            columnNames: USER_ID
            constraintName: PK_USR_USER
        - createSequence:
            sequenceName: SEQ_USER
        - createTable:
            tableName: USR_DELETED_USER
            columns:
              - column:
                  name: USER_ID
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: EMAIL
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: NICKNAME
                  type: VARCHAR(63)
                  constraints:
                    nullable: false
              - column:
                  name: AUTH_TYPE
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: LAST_ACCESS
                  type: TIMESTAMP
              - column:
                  name: REMOVED_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: USR_DELETED_USER
            columnNames: USER_ID
            constraintName: PK_USR_DELETED_USER
