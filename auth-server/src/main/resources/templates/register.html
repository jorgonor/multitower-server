<html th:replace="~{layout :: mainContent('Register', ~{this :: #layoutcontent})}">
<body>
<div id="layoutcontent">

    <p th:if="${errorMessage}" th:text="${errorMessage}" class="error-message">Registration error</p>

    <h1 th:text="#{label.form.title}">form</h1>
    <form action="/register" th:object="${user}" method="POST" enctype="utf8">
        <div>
            <label th:text="#{label.user.email}" class="form-label" >e-mail</label>
            <input type="email" th:field="*{email}" class="form-control" />
            <p th:each="error : ${#fields.errors('email')}"
               th:text="${error}">Validation error</p>
        </div>
        <div>
            <label th:text="#{label.user.nickName}" class="form-label" >nickName</label>
            <input type="text" th:field="*{nickName}" class="form-control" />
            <p th:each="error : ${#fields.errors('nickName')}"
               th:text="${error}">Validation error</p>
        </div>
        <div>
            <label th:text="#{label.user.password}" class="form-label" >password</label>
            <input type="password" th:field="*{password}" class="form-control"/>
            <p th:each="error : ${#fields.errors('password')}"
               th:text="${error}">Validation error</p>
        </div>

        <button class="btn btn-primary" type="submit" th:text="#{label.form.submit}">Submit</button>
    </form>

    <a th:href="@{/login.html}" th:text="#{label.form.loginLink}">login</a>
</div>
</body>
</html>
